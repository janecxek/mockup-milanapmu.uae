<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="Placeholder: scar before">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#D7BDA6"/>
      <stop offset="0.52" stop-color="#BC9C82"/>
      <stop offset="1" stop-color="#8E735E"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.3" cy="0.25" r="0.72">
