<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1250" width="1000" height="1250" role="img" aria-label="Placeholder for a portrait of Milana">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#C9AE93"/>
      <stop offset="0.52" stop-color="#A98C74"/>
      <stop offset="1" stop-color="#6E5F55"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.3" cy="0.25" r="0.72">
      <stop offset="0" stop-color="#E7D3BC" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#E7D3BC" stop-opacity="0"/>
    </radialGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <filter id="soft"><feGaussianBlur stdDeviation="120"/></filter>
  </defs>
  <rect width="1000" height="1250" fill="url(#g)"/>
  <g filter="url(#soft)" opacity="0.75">
    <ellipse cx="280" cy="425" rx="300" ry="450" fill="#E7D3BC" opacity="0.5"/>
    <ellipse cx="740" cy="850" rx="260" ry="375" fill="#8C7461" opacity="0.45"/>
  </g>
  <rect width="1000" height="1250" fill="url(#glow)"/>
  <rect width="1000" height="1250" filter="url(#grain)" opacity="0.07"/>
  <g opacity="0.5" transform="translate(40 1181)">
    <rect x="0" y="-20" width="239" height="28" rx="14" fill="#1E1A18" opacity="0.42"/>
    <text x="14" y="0" font-family="ui-monospace, Menlo, monospace" font-size="13"
          letter-spacing="2.4" fill="#FFFFFF" opacity="0.9">PHOTO — MILANA AT WORK</text>
  </g>
</svg>
