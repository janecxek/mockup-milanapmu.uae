<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="Placeholder for a lip blush photograph">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E7C4BA"/>
      <stop offset="0.52" stop-color="#D3A196"/>
      <stop offset="1" stop-color="#A87A6E"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.3" cy="0.25" r="0.72">
      <stop offset="0" stop-color="#F6DDD5" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#F6DDD5" stop-opacity="0"/>
    </radialGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <filter id="soft"><feGaussianBlur stdDeviation="108"/></filter>
  </defs>
  <rect width="1200" height="900" fill="url(#g)"/>
  <g filter="url(#soft)" opacity="0.75">
    <ellipse cx="336" cy="306" rx="360" ry="324" fill="#F6DDD5" opacity="0.5"/>
    <ellipse cx="888" cy="612" rx="312" ry="270" fill="#C08D80" opacity="0.45"/>
  </g>
  <rect width="1200" height="900" fill="url(#glow)"/>
  <rect width="1200" height="900" filter="url(#grain)" opacity="0.07"/>
  <g opacity="0.5" transform="translate(48 850)">
    <rect x="0" y="-20" width="191" height="28" rx="14" fill="#1E1A18" opacity="0.42"/>
    <text x="14" y="0" font-family="ui-monospace, Menlo, monospace" font-size="13"
          letter-spacing="2.4" fill="#FFFFFF" opacity="0.9">PHOTO — LIP BLUSH</text>
  </g>
</svg>
