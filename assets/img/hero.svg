<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" role="img" aria-label="Placeholder for the hero photograph">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#B6A08C"/>
      <stop offset="0.52" stop-color="#8E7563"/>
      <stop offset="1" stop-color="#57493F"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.3" cy="0.25" r="0.72">
      <stop offset="0" stop-color="#E3CDB4" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#E3CDB4" stop-opacity="0"/>
    </radialGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <filter id="soft"><feGaussianBlur stdDeviation="129"/></filter>
  </defs>
  <rect width="1920" height="1080" fill="url(#g)"/>
  <g filter="url(#soft)" opacity="0.75">
    <ellipse cx="537" cy="367" rx="576" ry="388" fill="#E3CDB4" opacity="0.5"/>
    <ellipse cx="1420" cy="734" rx="499" ry="324" fill="#7A6455" opacity="0.45"/>
  </g>
  <rect width="1920" height="1080" fill="url(#glow)"/>
  <rect width="1920" height="1080" filter="url(#grain)" opacity="0.07"/>
  <g opacity="0.5" transform="translate(76 1020)">
    <rect x="0" y="-20" width="296" height="28" rx="14" fill="#1E1A18" opacity="0.42"/>
    <text x="14" y="0" font-family="ui-monospace, Menlo, monospace" font-size="13"
          letter-spacing="2.4" fill="#FFFFFF" opacity="0.9">HERO — TREATMENT IN PROGRESS</text>
  </g>
</svg>
