# Publishes the built site to GitHub Pages on every push to main.
#
# The site is plain static files committed at the repo root, so there is no
# build step here — the job only gathers the deployable subset (everything
# except the generator, the preview bundle and the docs) and hands it to Pages.
#
# Pages must be switched on once by hand first: Settings -> Pages -> Source ->
# "GitHub Actions". The workflow cannot do it — creating a Pages site needs repo
# administration rights, which the default GITHUB_TOKEN is never granted, so
# configure-pages with `enablement: true` fails with "Resource not accessible by
# integration" no matter what `permissions:` says.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; queue them instead of cancelling a live one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Assemble the deployable tree
        run: |
          mkdir _site
          cp -r .nojekyll *.html assets ru robots.txt sitemap.xml _site/
          echo "--- deploying:"
          find _site -type f | wc -l
          test -f _site/index.html
          test -f _site/ru/index.html
          test -f _site/assets/css/site.css

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
