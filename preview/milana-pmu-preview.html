<title>Milana PMU Dubai</title>
<style>/* ==========================================================================
   Milana PMU Dubai — design tokens
   Single source of truth for colour, type, space and motion.

   Visual language derived from Este Medical Group:
   gold accent, near-black type, warm graphite bands, silk-grey chrome.
   Change a value here and it propagates across every page.
   ========================================================================== */

:root {
  /* --- Gold ------------------------------------------------------------- */
  --gold:            #DFA615;  /* core accent: buttons, rules, logo mark    */
  --gold-deep:       #A9760A;  /* pressed states, gradient shadow           */
  --gold-light:      #F0C960;  /* gold text ON dark only (4.7:1 on graphite)*/
  --gold-text:       #8A6108;  /* gold-toned text/icons ON light (5.0:1)    */
  --gold-sheen:      #FBE9B4;  /* highlight band inside metallic gradients  */
  --gold-veil:       rgba(223, 166, 21, .12);

  /* --- Ink -------------------------------------------------------------- */
  --ink:             #141210;  /* headings, nav                             */
  --ink-body:        #45403B;  /* body copy on light (8.4:1 on --silk)      */
  --ink-mute:        #6E665E;  /* captions, meta (5.0:1 on --silk)          */

  /* --- Warm graphite: the dark bands ------------------------------------ */
  --graphite:        #5C5450;  /* Este's taupe band, deepened for contrast  */
  --graphite-deep:   #322D2A;  /* footer, hero scrim                        */
  --graphite-ink:    #1E1A18;  /* deepest — image scrims                    */

  /* --- Silk: page + chrome ---------------------------------------------- */
  --silk:            #F4F2EF;  /* page ground                               */
  --silk-warm:       #EDE9E3;  /* alternating section band                  */
  --white:           #FFFFFF;
  --line:            rgba(20, 18, 16, .12);
  --line-strong:     rgba(20, 18, 16, .22);
  --line-on-dark:    rgba(255, 255, 255, .18);

  /* --- Skin / pigment swatches (the signature) -------------------------- */
  /* Not decoration: these are the tone families a camouflage match works in */
  --tone-01: #F3DCCB;  --tone-02: #EBCBB2;  --tone-03: #DFB694;
  --tone-04: #CE9E78;  --tone-05: #B5825E;  --tone-06: #986748;
  --tone-07: #7A4F36;  --tone-08: #5C3A28;

  /* --- Semantic --------------------------------------------------------- */
  --bg:              var(--silk);
  --fg:              var(--ink);
  --accent:          var(--gold);
  --on-accent:       var(--ink);       /* black on gold — 8.5:1             */

  /* --- Type ------------------------------------------------------------- */
  --font-sans:  "Manrope", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono:  "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;

  --fs-display: clamp(2.6rem, 1.4rem + 4.6vw, 5.5rem);
  --fs-h1:      clamp(2.1rem, 1.3rem + 3.2vw, 3.9rem);
  --fs-h2:      clamp(1.65rem, 1.15rem + 2vw, 2.75rem);
  --fs-h3:      clamp(1.15rem, 1rem + .7vw, 1.5rem);
  --fs-lead:    clamp(1.02rem, .97rem + .35vw, 1.2rem);
  --fs-body:    1rem;
  --fs-small:   .875rem;
  --fs-eyebrow: .715rem;

  --lh-tight:   1.04;
  --lh-snug:    1.22;
  --lh-body:    1.68;

  --tr-display: -.025em;   /* tighten large caps                            */
  --tr-eyebrow: .22em;     /* Este's wide letterspaced labels               */
  --tr-caps:    .02em;

  /* --- Space (density 4/10 — standard marketing rhythm) ----------------- */
  --sp-1: .5rem;   --sp-2: .75rem;  --sp-3: 1rem;    --sp-4: 1.5rem;
  --sp-5: 2rem;    --sp-6: 3rem;    --sp-7: 4rem;    --sp-8: 6rem;
  --sp-9: 8rem;

  --section-y: clamp(4rem, 2rem + 7vw, 8rem);
  --container: 1240px;
  --container-narrow: 780px;
  --gutter: clamp(1.25rem, .5rem + 2.5vw, 2.5rem);

  /* --- Radius & elevation ----------------------------------------------- */
  --r-sm: 4px;  --r-md: 8px;  --r-lg: 14px;  --r-pill: 999px;

  --sh-1: 0 1px 2px rgba(20,18,16,.05), 0 2px 8px rgba(20,18,16,.05);
  --sh-2: 0 2px 6px rgba(20,18,16,.06), 0 12px 30px rgba(20,18,16,.09);
  --sh-3: 0 4px 12px rgba(20,18,16,.08), 0 26px 60px rgba(20,18,16,.14);
  --sh-gold: 0 6px 20px rgba(169,118,10,.28);

  /* --- Motion ----------------------------------------------------------- */
  --ease:      cubic-bezier(.22, .61, .36, 1);
  --ease-out:  cubic-bezier(.16, 1, .3, 1);
  --t-fast:    150ms;
  --t-base:    260ms;
  --t-slow:    620ms;

  /* --- Chrome ----------------------------------------------------------- */
  --header-h: 76px;
  --rule-h: 4px;   /* the gold rule under the header — Este's signature     */
}

/* Metallic gold: used on rules, the logo mark and the primary button edge.  */
:root {
  --grad-gold: linear-gradient(
    100deg,
    var(--gold-deep) 0%,
    var(--gold) 22%,
    var(--gold-sheen) 46%,
    var(--gold) 62%,
    var(--gold-deep) 100%
  );
  /* Este's silk-grey chrome: soft diagonal light streaks across the header  */
  --grad-silk: linear-gradient(
    108deg,
    #EFEDEA 0%, #FBFAF9 18%, #E9E6E1 34%, #FDFCFB 52%,
    #EDEAE6 68%, #FAF9F7 84%, #EEEBE7 100%
  );
  --grad-graphite: linear-gradient(160deg, var(--graphite) 0%, var(--graphite-deep) 100%);
}

@media (max-width: 720px) {
  :root { --header-h: 64px; }
}

/* ==========================================================================
   Milana PMU Dubai — site stylesheet
   Order: reset → primitives → chrome → sections → components → utilities
   Every colour, size and duration comes from tokens.css.
   ========================================================================== */

/* --- Reset ---------------------------------------------------------------*/
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
html.lenis, html.lenis body { height: auto; }
html.lenis { scroll-behavior: auto; }
html.lenis:not(.lenis-autoToggle).lenis-stopped { overflow: clip; }
html.lenis [data-lenis-prevent] { overscroll-behavior: contain; }
body, h1, h2, h3, h4, p, figure, blockquote, dl, dd, ul, ol { margin: 0; padding: 0; }
ul[class], ol[class] { list-style: none; }
img, svg, video { display: block; max-width: 100%; }
button, input, select, textarea { font: inherit; color: inherit; }
button { background: none; border: 0; }

@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  *, *::before, *::after {
    animation-duration: .01ms !important; animation-iteration-count: 1 !important;
    transition-duration: .01ms !important; scroll-behavior: auto !important;
  }
}

/* --- Primitives ----------------------------------------------------------*/
body {
  font-family: var(--font-sans);
  font-size: var(--fs-body);
  line-height: var(--lh-body);
  color: var(--ink-body);
  background: var(--bg);
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}

h1, h2, h3, h4 { color: var(--ink); line-height: var(--lh-snug); font-weight: 800; }
h1 { font-size: var(--fs-h1); }
h2 { font-size: var(--fs-h2); }
h3 { font-size: var(--fs-h3); font-weight: 700; }

p { max-width: 62ch; }          /* readable measure — never justified */
a { color: inherit; text-decoration-thickness: 1px; text-underline-offset: .22em; }

:focus-visible {
  outline: 3px solid var(--gold);
  outline-offset: 3px;
  border-radius: 2px;
}

::selection { background: var(--gold); color: var(--ink); }

.skip-link {
  position: absolute; left: var(--sp-3); top: var(--sp-3);
  z-index: 200; padding: .75rem 1.25rem;
  background: var(--ink); color: var(--white);
  border-radius: var(--r-pill); font-weight: 700;
  transform: translateY(-160%); transition: transform var(--t-base) var(--ease);
}
.skip-link:focus-visible { transform: translateY(0); }

/* --- Layout --------------------------------------------------------------*/
.wrap { width: 100%; max-width: var(--container); margin-inline: auto; padding-inline: var(--gutter); }
.wrap--narrow { max-width: var(--container-narrow); }
.section { padding-block: var(--section-y); }
.section--warm { background: var(--silk-warm); }
.section--white { background: var(--white); }
.section--dark { background: var(--grad-graphite); color: rgba(255,255,255,.86); }
.section--dark h2, .section--dark h3, .section--dark h4 { color: var(--white); }
.section--dark p { color: rgba(255,255,255,.82); }
.section--tight { padding-block: clamp(2.5rem, 1.5rem + 3.5vw, 4.5rem); }

/* --- Type system ---------------------------------------------------------
   Caps are used in exactly two places: the mono utility face (labels, codes,
   data) and display headings. Anything a person acts on is sentence case —
   Manrope's uppercase T sidebearings split words like RESULTS and WHATSAPP.  */
.eyebrow {
  display: inline-flex; align-items: center; gap: .6rem;
  font-family: var(--font-mono);
  font-size: var(--fs-eyebrow); font-weight: 500;
  letter-spacing: var(--tr-eyebrow); text-transform: uppercase;
  color: var(--ink-mute);
}
.eyebrow::before {
  content: ""; width: 26px; height: 2px; background: var(--gold); flex: none;
}
.section--dark .eyebrow { color: var(--gold-light); }
.eyebrow--center { justify-content: center; }

.display {
  font-size: var(--fs-display);
  line-height: var(--lh-tight);
  letter-spacing: var(--tr-display);
  font-weight: 800;
  text-transform: uppercase;
  text-wrap: balance;
}
.h2-caps { text-transform: uppercase; letter-spacing: var(--tr-caps); text-wrap: balance; }
.lead { font-size: var(--fs-lead); color: var(--ink-mute); }
.section--dark .lead { color: rgba(255,255,255,.78); }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }

/* --- Buttons -------------------------------------------------------------*/
.btn {
  --btn-bg: var(--ink); --btn-fg: var(--white); --btn-bd: var(--ink);
  display: inline-flex; align-items: center; justify-content: center; gap: .6rem;
  min-height: 48px; padding: .85rem 1.6rem;
  background: var(--btn-bg); color: var(--btn-fg);
  border: 1.5px solid var(--btn-bd); border-radius: var(--r-pill);
  font-weight: 700; font-size: var(--fs-small);
  letter-spacing: .005em;
  text-decoration: none; cursor: pointer;
  transition: transform var(--t-fast) var(--ease),
              box-shadow var(--t-base) var(--ease),
              background-color var(--t-base) var(--ease),
              color var(--t-base) var(--ease);
}
.btn:hover { transform: translateY(-2px); box-shadow: var(--sh-2); }
.btn:active { transform: translateY(0); }

.btn--gold {
  --btn-bg: var(--gold); --btn-fg: var(--ink); --btn-bd: var(--gold);
  position: relative; overflow: hidden;
}
.btn--gold:hover { box-shadow: var(--sh-gold); }
/* Silk sweep — the one metallic flourish, borrowed from the brand's gold rule */
.btn--gold::after {
  content: ""; position: absolute; inset: 0;
  background: linear-gradient(100deg, transparent 30%, rgba(255,255,255,.55) 50%, transparent 70%);
  transform: translateX(-120%);
}
.btn--gold:hover::after { animation: sweep 700ms var(--ease-out); }
@keyframes sweep { to { transform: translateX(120%); } }

.btn--ghost { --btn-bg: transparent; --btn-fg: var(--ink); --btn-bd: var(--line-strong); }
.btn--ghost:hover { --btn-bd: var(--ink); }
.section--dark .btn--ghost { --btn-fg: var(--white); --btn-bd: var(--line-on-dark); }
.section--dark .btn--ghost:hover { --btn-bd: var(--gold); }
.btn--lg { min-height: 56px; padding: 1rem 2rem; font-size: .92rem; }
.btn-row { display: flex; flex-wrap: wrap; gap: var(--sp-2); }

/* --- Header --------------------------------------------------------------*/
.header {
  position: fixed; inset-inline: 0; top: 0; z-index: 100;
  background: var(--grad-silk);
  border-bottom: 1px solid rgba(20,18,16,.06);
  transition: box-shadow var(--t-base) var(--ease);
}
.header.is-stuck { box-shadow: 0 6px 24px rgba(20,18,16,.10); }

.header__inner {
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: center; gap: var(--sp-3);
  min-height: var(--header-h);
  max-width: var(--container); margin-inline: auto;
  padding-inline: var(--gutter);
}

/* The gold rule — Este's signature band, here doubling as scroll progress   */
.header__rule { height: var(--rule-h); background: var(--gold-veil); position: relative; }
.header__rule span {
  display: block; height: 100%; width: var(--progress, 0%);
  background: var(--grad-gold);
  background-size: 220% 100%;
  transition: width 90ms linear;
}

.brand { display: inline-flex; flex-direction: column; align-items: center; text-decoration: none; line-height: 1; }
.brand__name {
  font-size: 1.32rem; font-weight: 800; letter-spacing: -.02em;
  color: var(--ink); display: inline-flex; align-items: center; gap: .3rem;
}
.brand__mark { width: 20px; height: 20px; flex: none; }
.brand__sub {
  font-family: var(--font-mono); font-size: .56rem; font-weight: 500;
  letter-spacing: .34em; text-transform: uppercase;
  color: var(--gold-text); margin-top: .34rem; padding-left: .34em;
}

.nav { display: flex; align-items: center; gap: clamp(.9rem, 1.6vw, 1.9rem); }
/* Links gather around the wordmark; the language switch and Book are pushed
   to the outer edges so they read as controls, not as more navigation. */
.nav--start { justify-content: flex-end; padding-right: clamp(.5rem, 2vw, 2rem); }
/* Balances the language switch and Book on the far right, and gives the
   header a second real action instead of dead space. */
.nav__tel {
  margin-right: auto; display: inline-flex; align-items: center; gap: .45rem;
  padding-block: .4rem; text-decoration: none; white-space: nowrap;
  font-family: var(--font-mono); font-size: .72rem; font-weight: 500;
  letter-spacing: .06em; color: var(--ink-mute);
  transition: color var(--t-fast) var(--ease);
}
.nav__tel:hover { color: var(--ink); }
.nav__tel svg { width: 15px; height: 15px; color: var(--gold-text); }
@media (max-width: 1240px) { .nav__tel span { display: none; } }
.nav--end { justify-content: flex-start; padding-left: clamp(.5rem, 2vw, 2rem); }
.nav--end .lang { margin-left: auto; }
.nav__link {
  position: relative; padding: .5rem 0;
  font-size: .875rem; font-weight: 600; color: var(--ink);
  text-decoration: none; white-space: nowrap;
}
.nav__link::after {
  content: ""; position: absolute; left: 0; right: 0; bottom: 0;
  height: 2px; background: var(--gold);
  transform: scaleX(0); transform-origin: left;
  transition: transform var(--t-base) var(--ease);
}
.nav__link:hover::after, .nav__link[aria-current="page"]::after { transform: scaleX(1); }

.lang {
  display: inline-flex; align-items: center; flex: none;
  border: 1px solid var(--line-strong); border-radius: var(--r-pill);
  padding: 2px;
}
.lang a {
  min-width: 38px; min-height: 32px;
  display: inline-flex; align-items: center; justify-content: center;
  font-family: var(--font-mono); font-size: .68rem; font-weight: 700;
  letter-spacing: .08em; text-decoration: none; color: var(--ink-mute);
  border-radius: var(--r-pill);
}
.lang a[aria-current="true"] { background: var(--ink); color: var(--white); }

.burger {
  display: none; width: 48px; height: 48px; cursor: pointer;
  align-items: center; justify-content: center;
}
.burger span, .burger span::before, .burger span::after {
  content: ""; display: block; width: 22px; height: 2px; background: var(--ink);
  transition: transform var(--t-base) var(--ease), opacity var(--t-fast) var(--ease);
}
.burger span::before { transform: translateY(-7px); }
.burger span::after  { transform: translateY(5px); }
.burger[aria-expanded="true"] span { background: transparent; }
.burger[aria-expanded="true"] span::before { transform: rotate(45deg); }
.burger[aria-expanded="true"] span::after  { transform: rotate(-45deg) translateY(-1px); }

@media (max-width: 1080px) {
  /* Explicit placement: brand and burger stay pinned to row 1 while the
     drawer's two nav groups stack underneath. */
  .header__inner { grid-template-columns: 1fr auto; align-items: center; }
  .brand { align-items: flex-start; grid-column: 1; grid-row: 1; }
  .burger { display: inline-flex; grid-column: 2; grid-row: 1; justify-self: end; }
  .nav { display: none; grid-column: 1 / -1; }
  .nav__tel { display: none; }

  .drawer-open .nav {
    display: flex; flex-direction: column; align-items: stretch; gap: 0;
    padding-block: var(--sp-2); border-top: 1px solid var(--line);
  }
  .drawer-open .nav__link { padding: .95rem 0; font-size: 1.05rem; border-bottom: 1px solid var(--line); }
  .drawer-open .nav__link::after { display: none; }
  .drawer-open .nav--end { padding-bottom: var(--sp-4); }
  .drawer-open .nav .btn { margin-top: var(--sp-3); }
  .drawer-open .lang { margin: var(--sp-3) 0 0; align-self: flex-start; }
  .drawer-open .header__inner { max-height: calc(100dvh - var(--rule-h)); overflow-y: auto; }
}

.page { padding-top: calc(var(--header-h) + var(--rule-h)); }

/* --- Hero ----------------------------------------------------------------*/
.hero { position: relative; isolation: isolate; background: var(--graphite-ink); }
.hero__media { position: absolute; inset: 0; z-index: -2; }
.hero__media img { width: 100%; height: 100%; object-fit: cover; }
.hero__media::after {
  content: ""; position: absolute; inset: 0;
  background:
    linear-gradient(92deg, rgba(30,26,24,.90) 0%, rgba(30,26,24,.72) 42%, rgba(30,26,24,.28) 78%, rgba(30,26,24,.42) 100%),
    linear-gradient(to top, rgba(30,26,24,.80) 0%, transparent 45%);
}
.hero__inner {
  display: grid; align-content: center;
  min-height: clamp(560px, 84vh, 860px);
  padding-block: var(--sp-8) var(--sp-6);
}
.hero__copy { max-width: 46rem; }
.hero .eyebrow { color: var(--gold-light); }
.hero__title { color: var(--white); margin-top: var(--sp-3); }
.hero__title em { font-style: normal; color: var(--gold-light); }
.hero__lead {
  margin-top: var(--sp-4); max-width: 44ch;
  font-size: var(--fs-lead); color: rgba(255,255,255,.84);
}
.hero .btn-row { margin-top: var(--sp-5); }
.hero .btn--ghost { --btn-fg: var(--white); --btn-bd: rgba(255,255,255,.45); }
.hero .btn--ghost:hover { --btn-bd: var(--gold); }

.hero__facts {
  display: flex; flex-wrap: wrap; gap: var(--sp-2) var(--sp-5);
  margin-top: var(--sp-6); padding-top: var(--sp-4);
  border-top: 1px solid rgba(255,255,255,.16);
}
.hero__fact {
  display: flex; align-items: center; gap: .55rem;
  font-size: var(--fs-small); color: rgba(255,255,255,.82);
}
.hero__fact svg { width: 18px; height: 18px; flex: none; color: var(--gold-light); }

/* --- Pigment strip — the signature ---------------------------------------
   Skin-tone swatches are the actual craft: a camouflage pigment is mixed to
   match the client. The strip is used as the connective tissue of the site. */
.pigment-strip { display: grid; grid-template-columns: repeat(8, 1fr); }
.pigment-strip div { height: clamp(8px, 1.2vw, 14px); }
.pigment-strip div:nth-child(1) { background: var(--tone-01); }
.pigment-strip div:nth-child(2) { background: var(--tone-02); }
.pigment-strip div:nth-child(3) { background: var(--tone-03); }
.pigment-strip div:nth-child(4) { background: var(--tone-04); }
.pigment-strip div:nth-child(5) { background: var(--tone-05); }
.pigment-strip div:nth-child(6) { background: var(--tone-06); }
.pigment-strip div:nth-child(7) { background: var(--tone-07); }
.pigment-strip div:nth-child(8) { background: var(--tone-08); }

/* --- Section head --------------------------------------------------------*/
.head { max-width: 46rem; }
.head--center { margin-inline: auto; text-align: center; }
.head--center p { margin-inline: auto; }
.head h2 { margin-top: var(--sp-3); }
.head p { margin-top: var(--sp-3); }
.head--split {
  display: grid; gap: var(--sp-4); max-width: none;
  grid-template-columns: minmax(0, 1fr);
  align-items: end;
}
@media (min-width: 900px) {
  .head--split { grid-template-columns: minmax(0, 1.15fr) minmax(0, .85fr); gap: var(--sp-6); }
  .head--split > :last-child { padding-bottom: .4rem; }
}

/* --- Cards ---------------------------------------------------------------*/
.grid { display: grid; gap: var(--sp-4); }
.grid--3 { grid-template-columns: repeat(auto-fit, minmax(min(100%, 280px), 1fr)); }
.grid--2 { grid-template-columns: repeat(auto-fit, minmax(min(100%, 340px), 1fr)); }
.grid--4 { grid-template-columns: repeat(auto-fit, minmax(min(100%, 220px), 1fr)); }

.card {
  position: relative; display: flex; flex-direction: column;
  background: var(--white); border: 1px solid var(--line);
  border-radius: var(--r-lg); overflow: hidden;
  transition: transform var(--t-base) var(--ease), box-shadow var(--t-base) var(--ease);
}
.card:hover { transform: translateY(-4px); box-shadow: var(--sh-2); }
.card__media { position: relative; aspect-ratio: 4 / 3; background: var(--silk-warm); }
.card__media img { width: 100%; height: 100%; object-fit: cover; }
.card__body { display: flex; flex-direction: column; gap: var(--sp-2); padding: var(--sp-4); flex: 1; }
.card__title { letter-spacing: -.01em; }
.card__meta {
  display: flex; flex-wrap: wrap; align-items: baseline;
  justify-content: space-between; gap: .5rem var(--sp-2);
  margin-top: auto; padding-top: var(--sp-3); border-top: 1px solid var(--line);
}
.card__price { font-family: var(--font-mono); font-weight: 700; color: var(--ink); font-size: 1.02rem; }
.card__price small { font-size: .68rem; font-weight: 500; color: var(--ink-mute); letter-spacing: .1em; }
.card__link {
  font-size: var(--fs-small); font-weight: 700;
  letter-spacing: .005em; text-decoration: none; color: var(--ink);
  display: inline-flex; align-items: center; gap: .4rem; white-space: nowrap;
}
.card__link { padding-block: .3rem; }
.card__link svg { width: 15px; height: 15px; transition: transform var(--t-base) var(--ease); }
.card:hover .card__link svg { transform: translateX(4px); }
/* whole-card click target, keyboard focus still lands on the real link */
.card__link::before { content: ""; position: absolute; inset: 0; }

.card--flat { background: transparent; border-color: transparent; }
.card--flat:hover { transform: none; box-shadow: none; }

/* --- Tone matcher (interactive signature) --------------------------------*/
.matcher { display: grid; gap: var(--sp-5); }
@media (min-width: 900px) { .matcher { grid-template-columns: minmax(0,1fr) minmax(0,1fr); align-items: start; } }

.tones { display: flex; flex-wrap: wrap; gap: var(--sp-2); margin-top: var(--sp-4); }
.tone {
  width: 60px; height: 60px; border-radius: var(--r-md);
  border: 2px solid transparent; box-shadow: inset 0 0 0 1px rgba(0,0,0,.12);
  cursor: pointer; position: relative;
  transition: transform var(--t-fast) var(--ease), border-color var(--t-fast) var(--ease);
}
.tone:hover { transform: translateY(-3px); }
.tone[aria-pressed="true"] { border-color: var(--gold); transform: translateY(-3px); }
.tone[aria-pressed="true"]::after {
  content: ""; position: absolute; inset: -8px; border: 1px solid var(--gold-light);
  border-radius: calc(var(--r-md) + 6px);
}

.match-card {
  background: rgba(255,255,255,.06); border: 1px solid var(--line-on-dark);
  border-radius: var(--r-lg); padding: var(--sp-4);
}
.match-card__swatches { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--sp-2); }
.match-swatch { text-align: center; }
.match-swatch i {
  display: block; height: 74px; border-radius: var(--r-md);
  border: 1px solid var(--line-on-dark);
  transition: background-color var(--t-slow) var(--ease);
}
.match-swatch b {
  display: block; margin-top: .55rem;
  font-family: var(--font-mono); font-size: .66rem; font-weight: 500;
  letter-spacing: .12em; text-transform: uppercase; color: var(--gold-light);
}
.match-card__note { margin-top: var(--sp-3); font-size: var(--fs-small); }

/* --- Before / after ------------------------------------------------------*/
.ba {
  position: relative; border-radius: var(--r-lg); overflow: hidden;
  background: var(--silk-warm); border: 1px solid var(--line);
}
.ba__frame { position: relative; aspect-ratio: 4 / 3; }
.ba__frame img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.ba__after { clip-path: inset(0 0 0 var(--pos, 50%)); }
.ba__handle {
  position: absolute; top: 0; bottom: 0; left: var(--pos, 50%);
  width: 2px; background: var(--gold); pointer-events: none;
}
.ba__handle::after {
  content: ""; position: absolute; top: 50%; left: 50%;
  width: 42px; height: 42px; transform: translate(-50%,-50%);
  border-radius: 50%; background: var(--gold); box-shadow: var(--sh-2);
}
.ba__range {
  position: absolute; inset: 0; width: 100%; height: 100%;
  margin: 0; opacity: 0; cursor: ew-resize;
}
.ba__range:focus-visible + .ba__handle::after { outline: 3px solid var(--white); outline-offset: 2px; }
.ba__tag {
  position: absolute; bottom: var(--sp-2); z-index: 2;
  padding: .3rem .7rem; border-radius: var(--r-pill);
  background: rgba(30,26,24,.72); color: var(--white);
  font-family: var(--font-mono); font-size: .62rem; font-weight: 500;
  letter-spacing: .14em; text-transform: uppercase; pointer-events: none;
}
.ba__tag--before { left: var(--sp-2); }
.ba__tag--after  { right: var(--sp-2); }
.ba__caption {
  display: flex; justify-content: space-between; gap: var(--sp-2);
  padding: var(--sp-3) var(--sp-4); background: var(--white);
  border-top: 1px solid var(--line); font-size: var(--fs-small);
}
.ba__caption span:last-child { font-family: var(--font-mono); color: var(--ink-mute); font-size: .72rem; letter-spacing: .1em; text-transform: uppercase; }

/* --- Healing timeline ----------------------------------------------------
   Ordered because the order is the information: this is what the skin does. */
.timeline { display: grid; gap: 0; margin-top: var(--sp-6); }
@media (min-width: 860px) { .timeline { grid-template-columns: repeat(5, 1fr); } }
.timeline__step { position: relative; padding: var(--sp-4) var(--sp-4) var(--sp-4) 0; }
.timeline__step + .timeline__step { border-top: 1px solid var(--line); }
@media (min-width: 860px) {
  .timeline__step { padding: var(--sp-5) var(--sp-3) 0 0; border-top: 1px solid var(--line); }
  .timeline__step + .timeline__step { border-top: 1px solid var(--line); }
}
.timeline__step::before {
  content: ""; position: absolute; top: -1px; left: 0;
  width: 34px; height: 3px; background: var(--gold);
}
@media (max-width: 859px) { .timeline__step:first-child::before { display: none; } }
.timeline__day {
  font-family: var(--font-mono); font-size: .7rem; font-weight: 700;
  letter-spacing: .16em; text-transform: uppercase; color: var(--gold-text);
}
.section--dark .timeline__day { color: var(--gold-light); }
.section--dark .timeline__step { border-color: var(--line-on-dark); }
.timeline__step h3 { margin-top: .5rem; font-size: 1.05rem; letter-spacing: -.01em; }
.timeline__step p { margin-top: .5rem; font-size: var(--fs-small); }

/* --- Steps (home service) ------------------------------------------------*/
.steps { counter-reset: step; display: grid; gap: var(--sp-4); }
.step { display: grid; grid-template-columns: auto 1fr; gap: var(--sp-3); align-items: start; }
.step__num {
  counter-increment: step;
  width: 44px; height: 44px; flex: none;
  display: grid; place-items: center; border-radius: 50%;
  border: 1.5px solid var(--gold);
  font-family: var(--font-mono); font-size: .82rem; font-weight: 700; color: var(--ink);
}
.step__num::before { content: counter(step, decimal-leading-zero); }
.section--dark .step__num { color: var(--gold-light); }
.step h3 { font-size: 1rem; letter-spacing: -.01em; }
.step p { margin-top: .35rem; font-size: var(--fs-small); }

/* --- Pricing -------------------------------------------------------------*/
.price-table { width: 100%; border-collapse: collapse; margin-top: var(--sp-5); }
.price-table caption { text-align: left; padding-bottom: var(--sp-3); color: var(--ink-mute); font-size: var(--fs-small); }
.price-table th, .price-table td { padding: var(--sp-3) var(--sp-2); text-align: left; vertical-align: top; }
.price-table thead th {
  font-family: var(--font-mono); font-size: .68rem; font-weight: 500;
  letter-spacing: .16em; text-transform: uppercase; color: var(--ink-mute);
  border-bottom: 2px solid var(--ink);
}
.price-table thead th:last-child { text-align: right; }
.price-table tbody tr { border-bottom: 1px solid var(--line); }
.price-table tbody th { font-weight: 700; color: var(--ink); }
.price-table tbody th small { display: block; font-weight: 400; color: var(--ink-mute); font-size: var(--fs-small); margin-top: .2rem; }
.price-table td:last-child { text-align: right; font-family: var(--font-mono); font-weight: 700; color: var(--ink); white-space: nowrap; }
.price-note { font-size: .78rem; color: var(--ink-mute); }
@media (max-width: 640px) {
  .price-table thead { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
  .price-table tbody tr { display: grid; gap: .25rem; padding-block: var(--sp-3); }
  .price-table th, .price-table td { padding: 0; }
  .price-table td:last-child { text-align: left; }
}

/* --- FAQ (native details — keyboard + screen-reader correct) -------------*/
.faq { border-top: 1px solid var(--line); margin-top: var(--sp-5); }
.faq details { border-bottom: 1px solid var(--line); }
.faq summary {
  display: flex; align-items: center; justify-content: space-between; gap: var(--sp-3);
  padding: var(--sp-4) 0; cursor: pointer; list-style: none;
  font-weight: 700; color: var(--ink); font-size: 1.02rem;
}
.faq summary::-webkit-details-marker { display: none; }
.faq summary::after {
  content: ""; flex: none; width: 14px; height: 14px;
  border-right: 2px solid var(--gold-text); border-bottom: 2px solid var(--gold-text);
  transform: rotate(45deg) translate(-3px,-3px);
  transition: transform var(--t-base) var(--ease);
}
.faq details[open] summary::after { transform: rotate(-135deg) translate(-3px,-3px); }
.faq details > div { padding-bottom: var(--sp-4); }
.faq details > div p + p { margin-top: var(--sp-2); }

/* --- Quote slots ---------------------------------------------------------*/
.quote {
  background: var(--white); border: 1px solid var(--line);
  border-radius: var(--r-lg); padding: var(--sp-5);
  display: flex; flex-direction: column; gap: var(--sp-3);
}
.quote__mark { width: 26px; height: 26px; color: var(--gold); }
.quote p { font-size: 1.02rem; color: var(--ink); }
.quote footer { font-size: var(--fs-small); color: var(--ink-mute); margin-top: auto; }
.quote--slot { border-style: dashed; border-color: var(--line-strong); background: transparent; }
.quote--slot p { color: var(--ink-mute); font-style: italic; }

/* --- Forms ---------------------------------------------------------------*/
.field { display: grid; gap: .4rem; }
.field label { font-size: var(--fs-small); font-weight: 700; color: var(--ink); }
.field .hint { font-size: .78rem; color: var(--ink-mute); }
.field input, .field select, .field textarea {
  min-height: 48px; padding: .75rem 1rem;
  background: var(--white); border: 1.5px solid var(--line-strong);
  border-radius: var(--r-md); color: var(--ink);
  transition: border-color var(--t-fast) var(--ease), box-shadow var(--t-fast) var(--ease);
}
.field textarea { min-height: 130px; resize: vertical; }

  function initMatcher() {
    var matcher = document.querySelector('[data-matcher]');
    if (!matcher) return;
    var lang = html.lang === 'ru' ? 'ru' : 'en';
    var buttons = matcher.querySelectorAll('.tone');
    var outSkin = matcher.querySelector('[data-out="skin"]');
    var outBase = matcher.querySelector('[data-out="base"]');
    var outCorr = matcher.querySelector('[data-out="corr"]');
    var outCode = matcher.querySelector('[data-out="code"]');
    var outNote = matcher.querySelector('[data-out="note"]');

    function select(btn) {
      var code = btn.getAttribute('data-tone');
      var t = TONES[code];
      if (!t) return;
      buttons.forEach(function (b) { b.setAttribute('aria-pressed', String(b === btn)); });
      if (outSkin) outSkin.style.backgroundColor = t.skin;
      if (outBase) outBase.style.backgroundColor = t.base;
      if (outCorr) outCorr.style.backgroundColor = t.corr;
      if (outCode) outCode.textContent = code;
      if (outNote) outNote.textContent = COPY[lang][code] || '';
    }

    buttons.forEach(function (btn) { btn.addEventListener('click', function () { select(btn); }); });
    var initial = matcher.querySelector('.tone[aria-pressed="true"]') || buttons[0];
    if (initial) select(initial);
  }

  /* --- One-time global setup --------------------------------------------- */
  function boot() {
    if (window.__pmuBooted) { wire(); clearEntry(); return; }
    window.__pmuBooted = true;

    lenis = initLenis();
    if (lenis) {
      lenis.on('scroll', updateHeader);
    } else {
      var ticking = false;
      window.addEventListener('scroll', function () {
        if (ticking) return;

        requestAnimationFrame(function () { updateHeader(); ticking = false; });
      }, { passive: true });
    }

    /* Escape closes the mobile drawer (the dialog handles its own) */
    document.addEventListener('keydown', function (e) {
      var header = document.querySelector('.header');
      if (e.key !== 'Escape' || !header || !header.classList.contains('drawer-open')) return;

      header.classList.remove('drawer-open');

    /* Every internal navigation goes through the veil */
    document.addEventListener('click', function (e) {

      if (a.target === '_blank' || a.hasAttribute('download') || a.hasAttribute('data-book')) return;

      var href = a.getAttribute('href') || '';
      if (href.charAt(0) === '#') {                    /* same-page anchor */

        if (!el) return;
        e.preventDefault();
        scrollToEl(el);
        if (history.replaceState) history.replaceState(null, '', href);
        return;
      }
      var url = new URL(a.href, location.href);
      if (url.origin !== location.origin) return;
      if (url.pathname === location.pathname && url.hash) return;   /* let the browser handle it */

      e.preventDefault();
      var header = document.querySelector('.header');
      if (header) header.classList.remove('drawer-open');
      leaveTo(a.href, a.hasAttribute('data-lang') ? 'lang' : 'page');
    });

    /* Coming back through the bfcache must not leave the veil up */
    window.addEventListener('pageshow', function (ev) {
      if (!ev.persisted) return;
      var veil = document.getElementById('veil');
      if (veil) veil.classList.remove('is-on', 'veil--loading');
      html.classList.remove('is-entering', 'is-entering-lang');
      lockScroll(false);
    });

    /* The booking form composes a WhatsApp message; no backend involved. */
    var waForm = document.querySelector('[data-wa-form]');
    if (waForm) {
      waForm.addEventListener('submit', function (ev) {
        ev.preventDefault();
        var base = waForm.getAttribute('action').split('?')[0];
        var get = function (n) {
          var el = waForm.elements[n];
          return el && el.value ? el.value.trim() : '';

        var L = html.lang === 'ru'

        var lines = [L.hi];

         ['area', L.area], ['message', L.msg]].forEach(function (pair) {
          var v = get(pair[0]);
          if (v) lines.push(pair[1] + ': ' + v);
        });
        window.open(base + '?text=' + encodeURIComponent(lines.join('\n')), '_blank', 'noopener');
      });
    }

    wire();
    clearEntry();

    if (location.hash.length > 1) {
      var target = document.getElementById(location.hash.slice(1));
      if (target) window.setTimeout(function () { scrollToEl(target); }, 60);
    }
  }

  window.__initSite = boot;
  boot();
};

r\">\n    <span class=\"ba__handle\" aria-hidden=\"true\"><\/span>\n  <\/div>\n  <figcaption class=\"ba__caption\"><span>C-section scar<\/span><span>session 2 of 3<\/span><\/figcaption>\n<\/figure><\/div><\/div>\n    <div class=\"btn-row mt-5\"><a class=\"btn btn--ghost\" href=\"#/en/results\">See all results<\/a><\/div>\n  <\/div>\n<\/section>\n\n<section class=\"section section--warm\">\n  <div class=\"wrap\">\n    <div class=\"head reveal\">\n      <p class=\"eyebrow\">What to expect<\/p>\n      <h2 class=\"h2-caps\">The first month, day by day<\/h2>\n      <p class=\"lead\">Colour looks strongest on day one and settles over four weeks. Knowing the sequence is what stops people panicking on day three.<\/p>\n    <\/div>\n    <div class=\"timeline reveal\"><div class=\"timeline__step\"><p class=\"timeline__day\">Day 0<\/p><h3>Freshly done<\/h3><p>Colour sits 30–40% darker than the healed result. Slight swelling on lips is normal.<\/p><\/div><div class=\"timeline__step\"><p class=\"timeline__day\">Day 2–3<\/p><h3>Darkest point<\/h3><p>The pigment oxidises and looks bold. This is the stage clients worry about. It passes.<\/p><\/div><div class=\"timeline__step\"><p class=\"timeline__day\">Day 4–7<\/p><h3>Flaking<\/h3><p>A fine layer lifts away on its own. Do not pick it — it takes pigment with it.<\/p><\/div><div class=\"timeline__step\"><p class=\"timeline__day\">Day 8–14<\/p><h3>The grey phase<\/h3><p>New skin covers the pigment and the colour looks patchy and faded. It comes back.<\/p><\/div><div class=\"timeline__step\"><p class=\"timeline__day\">Day 28<\/p><h3>Settled<\/h3><p>True colour is visible. This is when we book the touch-up and correct anything uneven.<\/p><\/div><\/div>\n    <p class=\"price-note mt-5\">The touch-up sits four to eight weeks after the first session. It is part of the treatment, not an upsell: the first pass builds the base, the second sets the final colour.<\/p>\n  <\/div>\n<\/section>\n\n<section class=\"section section--white\">\n  <div class=\"wrap split\">\n    <div class=\"reveal\">\n      <p class=\"eyebrow\">Home service<\/p>\n      <h2 class=\"h2-caps\">I come to you<\/h2>\n      <p class=\"lead mt-4\">Dubai and Sharjah. You need a table, a socket and about three hours. Everything else arrives in the case.<\/p>\n      <ol class=\"steps mt-6\" style=\"list-style:none;padding:0\"><li class=\"step\"><span class=\"step__num\" aria-hidden=\"true\"><\/span><div><h3>Message on WhatsApp<\/h3><p>Send a daylight photo of the area and tell me what you want. You get an honest answer on what is realistic and how many sessions it takes.<\/p><\/div><\/li><li class=\"step\"><span class=\"step__num\" aria-hidden=\"true\"><\/span><div><h3>Consultation at your door<\/h3><p>Medical history, patch test, and the shape or the colour match agreed before anything starts. Nothing is tattooed until you say yes in a mirror.<\/p><\/div><\/li><li class=\"step\"><span class=\"step__num\" aria-hidden=\"true\"><\/span><div><h3>The session<\/h3><p>Two to three hours for brows or lips, one to three for a camouflage area. Sterile, single-use tooling, unsealed in front of you.<\/p><\/div><\/li><li class=\"step\"><span class=\"step__num\" aria-hidden=\"true\"><\/span><div><h3>Aftercare and touch-up<\/h3><p>Written aftercare, a check-in during the healing week, and the touch-up booked at four to eight weeks.<\/p><\/div><\/li><\/ol>\n    <\/div>\n    <div class=\"media-frame reveal\" data-delay=\"1\">\n      <img src=\"data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAxMjAwIDkwMCIgd2lkdGg9IjEyMDAiIGhlaWdodD0iOTAwIiByb2xlPSJpbWciIGFyaWEtbGFiZWw9IlBsYWNlaG9sZGVyIGZvciBhIGhvbWUgc2VydmljZSBzZXR1cCBwaG90b2dyYXBoIj4KICA8ZGVmcz4KICAgIDxsaW5lYXJHcmFkaWVudCBpZD0iZyIgeDE9IjAiIHkxPSIwIiB4Mj0iMSIgeTI9IjEiPgogICAgICA8c3RvcCBvZmZzZXQ9IjAiIHN0b3AtY29sb3I9IiNEOEJFOEIiLz4KICAgICAgPHN0b3Agb2Zmc2V0PSIwLjUyIiBzdG9wLWNvbG9yPSIjQjk5QTYyIi8+CiAgICAgIDxzdG9wIG9mZnNldD0iMSIgc3RvcC1jb2xvcj0iIzdBNjIzOCIvPgogIC ss=\"h2-caps\">Common questions<\/h2>\n    <\/div>\n    <div class=\"faq\"><details open><summary>Does it hurt?<\/summary><div><p>Topical anaesthetic goes on before and during the session. Most clients describe brows as scratching and lips as a warm buzzing. Camouflage on the body is usually the easiest of the three.<\/p><p>Skin is more sensitive in the week before a period — worth planning around.<\/p><\/div><\/details><details><summary>How long does it last?<\/summary><div><p>Powder brows one to two years, lip blush one to three, depending on skin type, sun exposure and skincare. Camouflage fades slowly and is topped up when needed.<\/p><p>Acids, retinol and strong sun shorten all of it.<\/p><\/div><\/details><details><summary>How soon after surgery can a scar be camouflaged?<\/summary><div><p>Usually at least twelve months, and only once your surgeon or doctor confirms the scar is fully mature, closed and no longer changing. Working too early can affect how it settles.<\/p><\/div><\/details><\/div>\n    <div class=\"btn-row mt-5\"><a class=\"btn btn--ghost\" href=\"#/en/faq\">All questions<\/a><\/div>\n  <\/div>\n<\/section>\n\n<section class=\"section section--dark\">\n  <div class=\"wrap\">\n    <div class=\"head head--center\">\n      <p class=\"eyebrow eyebrow--center\">Booking<\/p>\n      <h2 class=\"h2-caps\">Let&#x27;s look at your case<\/h2>\n      <p class=\"lead\">Send a photo on WhatsApp and you get an honest answer: what is possible, how many sessions it takes, and what it costs. No obligation.<\/p>\n      <div class=\"btn-row mt-5\" style=\"justify-content:center\">\n        <a class=\"btn btn--gold btn--lg\" href=\"https://wa.me/971500000000?text=Hi%20Milana%21%20I%20would%20like%20to%20book%20a%20PMU%20appointment.\" target=\"_blank\" rel=\"noopener\">Message on WhatsApp<\/a>\n        <a class=\"btn btn--ghost btn--lg\" href=\"#/en/contact\">Contact details<\/a>\n      <\/div>\n    <\/div>\n  <\/div>\n<\/section>\n<\/main>\n<div class=\"dock\">\n l\">\n      <p class=\"eyebrow\">Camouflage<\/p>\n      <h2 class=\"h2-caps\">Scar &amp; stretch mark camouflage<\/h2>\n      <p class=\"lead mt-4\">Making a mark stop catching the eye — by matching it, not covering it.<\/p>\n      <p class=\"mt-4\">Camouflage tattooing places skin-toned pigment into a mature scar, stretch mark or area of lost pigment so it blends with the skin around it. It does not remove the scar and it does not change its texture. What it removes is the colour contrast that makes your eye land there.<\/p><p class=\"mt-4\">The work runs across sessions, usually two to four, eight to twelve weeks apart. Scar tissue holds pigment unpredictably, so each session is planned from how the last one healed rather than from a fixed plan.<\/p><p class=\"mt-4\">Not every scar is suitable. Raised, keloid or still-red scars are not treated, and a patch test on a small area comes before any large one is started.<\/p>\n      <h3 class=\"mt-6\" style=\"font-size:1rem;letter-spacing:-.01em\">Good for<\/h3>\n      <ul class=\"mt-4\" style=\"list-style:none;padding:0;display:grid;gap:.6rem\"><li class='tick'>White, mature stretch marks on hips, thighs or chest<\/li><li class='tick'>C-section, tummy tuck and mastectomy scars<\/li><li class='tick'>Vitiligo and other areas of lost pigment<\/li><li class='tick'>Skin grafts and healed burn scars<\/li><li class='tick'>Scalp camouflage over scars in the hairline<\/li><li class='tick'>Old marks left by injury or surgery<\/li><\/ul>\n      <dl class=\"grid grid--4 mt-6\" style=\"margin:0\"><div><dt class=\"eyebrow\" style=\"display:block\">Session<\/dt><dd class=\"mono\" style=\"margin:.4rem 0 0;font-weight:700;color:var(--ink)\">1-3 h<\/dd><\/div><div><dt class=\"eyebrow\" style=\"display:block\">Sessions<\/dt><dd class=\"mono\" style=\"margin:.4rem 0 0;font-weight:700;color:var(--ink)\">2-4<\/dd><\/div><div><dt class=\"eyebrow\" style=\"display:block\">Spacing<\/dt><dd class=\"mono\" style=\"margin:.4rem 0 0;font-weight:70 \">Three rules I don&#x27;t break<\/h2>\n    <\/div>\n    <div class=\"grid grid--3 mt-6\"><div class=\"reveal\" data-delay=\"0\"><h3 style=\"letter-spacing:-.01em;font-size:1rem\">Shape before pigment<\/h3><p class=\"mt-4\" style=\"font-size:.925rem\">Nothing is tattooed until you have seen the drawn shape in a mirror and agreed to it. If we cannot agree on the shape, we do not start — and you pay nothing.<\/p><\/div><div class=\"reveal\" data-delay=\"1\"><h3 style=\"letter-spacing:-.01em;font-size:1rem\">Lighter than the target<\/h3><p class=\"mt-4\" style=\"font-size:.925rem\">Pigment darkens as it heals, so the first session builds a base deliberately under the final colour. The touch-up is where the colour is set. Anyone who finishes in one pass is guessing.<\/p><\/div><div class=\"reveal\" data-delay=\"2\"><h3 style=\"letter-spacing:-.01em;font-size:1rem\">Honest about what is possible<\/h3><p class=\"mt-4\" style=\"font-size:.925rem\">Some scars should not be tattooed, and some brows need a correction before anything new goes in. You get that answer before you pay a deposit, not after.<\/p><\/div><\/div>\n  <\/div>\n<\/section>\n<section class=\"section\">\n  <div class=\"wrap split\">\n    <div class=\"reveal\">\n      <p class=\"eyebrow\">Safety<\/p>\n      <h2 class=\"h2-caps\">Sterile, single-use, opened in front of you<\/h2>\n      <p class=\"lead mt-4\">A home service does not mean relaxed standards. The setup that arrives at your door is the setup you would expect to see in a studio.<\/p>\n      <ul class=\"mt-6\" style=\"list-style:none;padding:0;display:grid;gap:.7rem\"><li class='tick'>Needles and cartridges are single-use and unsealed in front of you<\/li><li class='tick'>Pigment cups, gloves, razors and liners are disposable<\/li><li class='tick'>Barrier film on every surface and on the machine<\/li><li class='tick'>Medical history and contraindications checked before the date is confirmed<\/li><li class='tick'>A patch test before any camouflage a ue\"><circle cx=\"20\" cy=\"20\" r=\"17\" stroke=\"var(--gold)\" stroke-width=\"3.4\" stroke-linecap=\"round\" stroke-dasharray=\"80 27\" transform=\"rotate(-28 20 20)\"/><path d=\"M20 12.5v15M12.5 20h15\" stroke=\"var(--gold)\" stroke-width=\"3.4\" stroke-linecap=\"round\"/><\/svg><\/span>Milana<\/span>\n      <span class=\"brand__sub\">PMU · DUBAI<\/span>\n    <\/a>\n    <nav class=\"nav nav--end\" aria-label=\"About and contact\">\n      <a class=\"nav__link\" href=\"#/en/about\">About<\/a><a class=\"nav__link\" href=\"#/en/faq\" aria-current=\"page\">FAQ<\/a><a class=\"nav__link\" href=\"#/en/contact\">Contact<\/a>\n      <div class=\"lang\" role=\"group\" aria-label=\"Language\"><a href=\"#/en/faq\" data-lang aria-current=\"true\" lang=\"en\">EN<\/a><a href=\"#/ru/faq\" data-lang aria-current=\"false\" lang=\"ru\">RU<\/a><\/div>\n      <a class=\"btn btn--gold\" href=\"https://wa.me/971500000000?text=Hi%20Milana%21%20I%20would%20like%20to%20book%20a%20PMU%20appointment.\" data-book aria-haspopup=\"dialog\" aria-controls=\"book-dialog\" target=\"_blank\" rel=\"noopener\">Book<\/a>\n    <\/nav>\n    <button class=\"burger\" type=\"button\" aria-expanded=\"false\" aria-label=\"Menu\"><span><\/span><\/button>\n  <\/div>\n  <div class=\"header__rule\"><span><\/span><\/div>\n<\/header>\n<main id=\"main\" class=\"page\">\n<section class=\"section section--tight\">\n  <div class=\"wrap\">\n    <div class=\"head\">\n      <p class=\"eyebrow\">FAQ<\/p>\n      <h1 class=\"display\" style=\"font-size:var(--fs-h1)\">Questions before booking<\/h1>\n      <p class=\"lead\">The ones that come up in DMs every week. If yours is not here, send it — an honest answer costs nothing.<\/p>\n    <\/div>\n  <\/div>\n<\/section>\n<div class=\"pigment-strip\" aria-hidden=\"true\"><div><\/div><div><\/div><div><\/div><div><\/div><div><\/div><div><\/div><div><\/div><div><\/div><\/div>\n<section class=\"section section--white\">\n  <div class=\"wrap wrap--narrow\"><section class=\"mt-6 reveal\"><h2 class=\"h2-caps\" style=\"font-size:var(--fs-h3)\">Before the appointment<\/h2><div class=\"faq\"><details><summary>Does it hurt?<\/summary><div><p>Topical anaesthetic goes on before and during the session. Most clients describe brows as scratching and lips as a warm buzzing. Camouflage on the body is usually the easiest of the three.<\/p><p>Skin is more sensitive in the week before a period — worth planning around.<\/p><\/div><\/details><details><summary>Who should not have permanent makeup?<\/summary><div><p>It is not done during pregnancy or breastfeeding, on active infection or inflammation in the area, or on keloid-prone skin. Ask your doctor first if you have diabetes, an autoimmune condition, take blood thinners, or have used isotretinoin (Accutane) in the last six to twelve months.<\/p><p>Tell me about any of these at the consultation. Several of them mean waiting, not never.<\/p><\/div><\/details><details><summary>What do I need to prepare at home?<\/summary><div><p>A table or a bed you can lie on, a socket nearby, and a room with daylight if possible. Set aside about three hours without interruptions.<\/p><p>Skip caffeine and alcohol on the day, and keep acids and retinol off the area for a week before.<\/p><\/div><\/details><details><summary>Can you fix work done by someone else?<\/summary><div><p>Sometimes. Send daylight photos of how it looks now and I will tell you whether it can be worked over, whether it needs lightening first, or whether it is better left to fade.<\/p><\/div><\/details><\/div><\/section><section class=\"mt-6 reveal\"><h2 class=\"h2-caps\" style=\"font-size:var(--fs-h3)\">During the session<\/h2><div class=\"faq\"><details><summary>How long does it take?<\/summary><div><p>Two and a half to three hours for brows or lips, including the consultation and the shape mapping. One to three hours for a camouflage area.<\/p><\/div><\/details><details><summary>Do I choose the colour?<\/summary><div><p>You choose the direction — warmer, cooler, softer, stronger. I mix within what your undertone will actually hold, and I will say so plainly if a request is going to heal badly.<\/p><\/div><\/details><details><summary>Will it look like makeup?<\/summary><div><p>On day one it looks stronger than the final result. Healed, powder brows read as a light powder and lip blush reads as your lips with more colour in them — not as lipstick.<\/p><\/div><\/details><\/div><\/section><section class=\"mt-6 reveal\"><h2 class=\"h2-caps\" style=\"font-size:var(--fs-h3)\">Healing and aftercare<\/h2><div class=\"faq\"><details><summary>What does the first month look like?<\/summary><div><p>Darkest around day two or three, flaking from day four to seven, a patchy grey stage in week two, and true colour around day 28. The full timeline is on the home page.<\/p><\/div><\/details><details><summary>Can I swim, work out or sunbathe?<\/summary><div><p>No pool, sea or sauna for two weeks, no heavy sweating in the first week, and no direct sun on the area until it has fully healed. After that, SPF is what keeps the colour.<\/p><\/div><\/details><details><summary>Do I have to have the touch-up?<\/summary><div><p>Yes, if you want the result the photographs show. The first session builds the base; the second sets the colour and corrects anything that healed unevenly. Between four and eight weeks after the first.<\/p><\/div><\/details><\/div><\/section><section class=\"mt-6 reveal\"><h2 class=\"h2-caps\" style=\"font-size:var(--fs-h3)\">Camouflage<\/h2><div class=\"faq\"><details><summary>How soon after surgery can a scar be treated?<\/summary><div><p>Usually at least twelve months, and only once your surgeon or doctor confirms the scar is mature, closed and no longer changing. Working too early can affect how it settles.<\/p><\/div><\/details><details><summary>Which scars are not suitable?<\/summary><div><p>Raised, keloid or hypertrophic scars, anything still red or purple, and scars that are still changing. Skin that tans strongly is also harder to match: the surrounding skin moves with the sun and the pigment does not.<\/p><\/div><\/details><details><summary>Does it work on stretch marks?<\/summary><div><p>On white, mature stretch marks that have lost their pigment, yes. On red or purple ones, no — they are still changing, and so is their colour.<\/p><\/div><\/details><details><summary>How many sessions does an area take?<\/summary><div><p>Usually two to four, eight to twelve weeks apart. The gap is not padding: scar tissue holds pigment unpredictably, and each session is planned from how the last one healed.<\/p><\/div><\/details><details><summary>Will the scar disappear completely?<\/summary><div><p>No — and anyone who promises that is selling something. Camouflage removes the colour contrast, not the texture. In daylight, at conversational distance, a well-matched area stops drawing the eye. That is the honest goal.<\/p><\/div><\/details><\/div><\/section>\n    <p class=\"price-note mt-6\">This page is general information about the treatments, not medical advice. If you have a medical condition, take regular medication, or are unsure about a scar, ask your doctor before booking.<\/p>\n  <\/div>\n<\/section>\n<section class=\"section section--dark\">\n  <div class=\"wrap\">\n    <div class=\"head head--center\">\n      <p class=\"eyebrow eyebrow--center\">Still unsure<\/p>\n      <h2 class=\"h2-caps\">Ask the question directly<\/h2>\n      <p class=\"lead\">If your situation is not covered here, message me. I would rather talk you out of a treatment than do one that will not work.<\/p>\n      <div class=\"btn-row mt-5\" style=\"justify-content:center\">\n        <a class=\"btn btn--gold btn--lg\" href=\"https://wa.me/971500000000?text=Hi%20Milana%21%20I%20would%20like%20to%20book%20a%20PMU%20appointment.\" target=\"_blank\" rel=\"noopener\">Message on WhatsApp<\/a>\n        <a class=\"btn btn--ghost btn--lg\" href=\"#/en/contact\">Contact details<\/a>\n      <\/div>\n    <\/div>\n  <\/div>       <p class=\"eyebrow\">Специализация<\/p>\n        <h2 class=\"h2-caps\">Камуфляж — это работа с цветом<\/h2>\n      <\/div>\n      <p class=\"lead\">Рубец не просто белый. Он другого цвета, чем кожа рядом, с другим подтоном, и ткань держит пигмент иначе. Чтобы попасть в тон, нужна смесь, проба на вашей коже и терпение на несколько визитов — поэтому большинство мастеров за это не берётся.<\/p>\n    <\/div>\n    <ul class=\"grid grid--4 mt-5 reveal\" style=\"list-style:none;padding:0\"><li class=\"tick\">Растяжки<\/li><li class=\"tick\">Кесарево и хирургические рубцы<\/li><li class=\"tick\">Витилиго и потеря пигмента<\/li><li class=\"tick\">Камуфляж на голове<\/li><li class=\"tick\">Пересадки кожи и ожоги<\/li><li class=\"tick\">Абдоминопластика и липосакция<\/li><li class=\"tick\">Старые следы после травм<\/li><li class=\"tick\">Зоны после мастэктомии<\/li><\/ul>\n    <div class=\"mt-6 reveal\"><div class=\"matcher\" data-matcher>\n  <div>\n    <h3 style=\"letter-spacing:-.01em\">Найдите свою отправную точку<\/h3>\n    <p class=\"mt-4\">Выберите тон, ближайший к коже вокруг рубца. Панель покажет, с чего начинается первый визит: база плюс корректор, намеренно светлее цели — пигмент темнеет при заживлении.<\/p>\n    <div class=\"tones\" role=\"group\" aria-label=\"Найдите свою отправную точку\"><button class=\"tone\" type=\"button\" data-tone=\"MS-01\" aria-pressed=\"false\" style=\"background:#F3DCCB\"><span class=\"sr-only\">Тон кожи MS-01<\/span><\/button><button class=\"tone\" type=\"button\" data-tone=\"MS-02\" aria-pressed=\"false\" style=\"background:#EBCBB2\"><span class=\"sr-only\">Тон кожи MS-02<\/span><\/button><button class=\"tone\" type=\"button\" data-tone=\"MS-03\" aria-pressed=\"false\" style=\"background:#DFB694\"><span class=\"sr-only\">Тон кожи MS-03<\/span><\/button><button class=\"tone\" type=\"button\" data-tone=\"MS-04\" aria-pressed=\"true\" style=\"background:#CE9E78\"><span class=\"sr-only\">Тон кожи MS-04<\/span><\/button><button class=\ p class=\"timeline__day\">День 8–14<\/p><h3>Серая фаза<\/h3><p>Новая кожа закрывает пигмент, цвет кажется пятнистым и выцветшим. Он вернётся.<\/p><\/div><div class=\"timeline__step\"><p class=\"timeline__day\">День 28<\/p><h3>Итог<\/h3><p>Виден настоящий цвет. В этот момент записываемся на коррекцию и правим неровности.<\/p><\/div><\/div>\n    <p class=\"price-note mt-5\">Коррекция — через четыре-восемь недель после первого визита. Это часть процедуры, а не допродажа: первый проход строит базу, второй задаёт финальный цвет.<\/p>\n  <\/div>\n<\/section>\n\n<section class=\"section section--white\">\n  <div class=\"wrap split\">\n    <div class=\"reveal\">\n      <p class=\"eyebrow\">Выезд на дом<\/p>\n      <h2 class=\"h2-caps\">Я приезжаю к вам<\/h2>\n      <p class=\"lead mt-4\">Дубай и Шарджа. От вас — стол, розетка и около трёх часов. Всё остальное приезжает в кейсе.<\/p>\n      <ol class=\"steps mt-6\" style=\"list-style:none;padding:0\"><li class=\"step\"><span class=\"step__num\" aria-hidden=\"true\"><\/span><div><h3>Написать в WhatsApp<\/h3><p>Пришлите фото зоны при дневном свете и скажите, чего хотите. В ответ — честная оценка: что реально сделать и за сколько визитов.<\/p><\/div><\/li><li class=\"step\"><span class=\"step__num\" aria-hidden=\"true\"><\/span><div><h3>Консультация у вас дома<\/h3><p>Разбираем анамнез, делаем тест пигмента и согласовываем форму или подбор цвета. Ничего не вводится, пока вы не скажете «да» перед зеркалом.<\/p><\/div><\/li><li class=\"step\"><span class=\"step__num\" aria-hidden=\"true\"><\/span><div><h3>Сама процедура<\/h3><p>Два-три часа на брови или губы, один-три — на зону камуфляжа. Стерильные одноразовые расходники вскрываются при вас.<\/p><\/div><\/li><li class=\"step\"><span class=\"step__num\" aria-hidden=\"true\"><\/span><div><h3>Уход и коррекция<\/h3><p>Письменные рекомендации, связь в неделю заживления и коррекция через четыре-восемь недель.<\/p><\/div><\/li><\/ol>\n    <\/div>\n    <div class=\"media-frame reveal\" \/div>\n    <div class=\"btn-row mt-5\" style=\"justify-content:center\">\n      <a class=\"btn btn--ghost\" href=\"https://www.instagram.com/milanapmu.uae/\" target=\"_blank\" rel=\"noopener\">Смотреть работы в Instagram<\/a>\n    <\/div>\n  <\/div>\n<\/section>\n\n<section class=\"section section--warm\">\n  <div class=\"wrap wrap--narrow\">\n    <div class=\"head reveal\">\n      <p class=\"eyebrow\">Перед записью<\/p>\n      <h2 class=\"h2-caps\">Частые вопросы<\/h2>\n    <\/div>\n    <div class=\"faq\"><details open><summary>Это больно?<\/summary><div><p>Анестезия наносится до и во время процедуры. Брови большинство описывает как царапание, губы — как тёплое жужжание. Камуфляж на теле обычно переносится легче всего.<\/p><p>За неделю до менструации кожа чувствительнее — это стоит учесть при записи.<\/p><\/div><\/details><details><summary>Сколько держится результат?<\/summary><div><p>Пудровые брови — один-два года, губы — один-три, в зависимости от типа кожи, солнца и ухода. Камуфляж выцветает медленно и обновляется по необходимости.<\/p><p>Кислоты, ретинол и активное солнце сокращают срок для всего.<\/p><\/div><\/details><details><summary>Через сколько после операции можно камуфлировать рубец?<\/summary><div><p>Обычно не раньше двенадцати месяцев и только после того, как хирург или врач подтвердит, что рубец полностью созрел, закрыт и больше не меняется. Работа раньше срока может повлиять на то, как он сядет.<\/p><\/div><\/details><\/div>\n    <div class=\"btn-row mt-5\"><a class=\"btn btn--ghost\" href=\"#/ru/faq\">Все вопросы<\/a><\/div>\n  <\/div>\n<\/section>\n\n<section class=\"section section--dark\">\n  <div class=\"wrap\">\n    <div class=\"head head--center\">\n      <p class=\"eyebrow eyebrow--center\">Запись<\/p>\n      <h2 class=\"h2-caps\">Давайте посмотрим ваш случай<\/h2>\n      <p class=\"lead\">Пришлите фото в WhatsApp — и получите честный ответ: что возможно, сколько нужно визитов и сколько это стоит. Без обязательств.<\/p>\n      <div class=\" lass=\"lead\">Три процедуры. Каждая начинается с вашего подтона и заканчивается коррекцией, которая задаёт финальный цвет.<\/p>\n    <\/div>\n  <\/div>\n<\/section>\n<div class=\"pigment-strip\" aria-hidden=\"true\"><div><\/div><div><\/div><div><\/div><div><\/div><div><\/div><div><\/div><div><\/div><div><\/div><\/div>\n<section class=\"section section--white\" id=\"powder-brows\">\n  <div class=\"wrap split\">\n    <div class=\"reveal\">\n      <p class=\"eyebrow\">Брови<\/p>\n      <h2 class=\"h2-caps\">Пудровые брови<\/h2>\n      <p class=\"lead mt-4\">Мягкая растушёвка, которая читается как лёгкая пудра, а не как нарисованная линия.<\/p>\n      <p class=\"mt-4\">Сначала форма строится прямо на лице: по костной структуре и вашей естественной брови, с правками до тех пор, пока прорисованный контур вас не устроит. Ни один прокол не делается, пока вы не посмотрите в зеркало и не согласитесь.<\/p><p class=\"mt-4\">Цвет смешивается так, чтобы у начала быть чуть светлее волос, а к хвостику — глубже: тогда бровь имеет направление, а не выглядит пятном. Первые три дня цвет ярче, потом оседает в тот тон, который вы утвердили.<\/p>\n      <h3 class=\"mt-6\" style=\"font-size:1rem;letter-spacing:-.01em\">Кому подходит<\/h3>\n      <ul class=\"mt-4\" style=\"list-style:none;padding:0;display:grid;gap:.6rem\"><li class='tick'>Редкие или перещипанные брови<\/li><li class='tick'>Брови, которые пропадают без макияжа<\/li><li class='tick'>Асимметрия, которую вы правите каждое утро<\/li><li class='tick'>Жирная кожа, на которой волоски расплываются<\/li><\/ul>\n      <dl class=\"grid grid--4 mt-6\" style=\"margin:0\"><div><dt class=\"eyebrow\" style=\"display:block\">Процедура<\/dt><dd class=\"mono\" style=\"margin:.4rem 0 0;font-weight:700;color:var(--ink)\">2,5-3 ч<\/dd><\/div><div><dt class=\"eyebrow\" style=\"display:block\">Коррекция<\/dt><dd class=\"mono\" style=\"margin:.4rem 0 0;font-weight:700;color:var(--ink)\">4-8 недель<\/dd><\/div><div><dt class=\"eyebrow\" style=\"disp r-spacing:-.01em\">Кому подходит<\/h3>\n      <ul class=\"mt-4\" style=\"list-style:none;padding:0;display:grid;gap:.6rem\"><li class='tick'>Бледный или неровный цвет губ<\/li><li class='tick'>Контур, потерявший чёткость<\/li><li class='tick'>Небольшая асимметрия сторон<\/li><li class='tick'>Желание цвета без ежедневного макияжа<\/li><\/ul>\n      <dl class=\"grid grid--4 mt-6\" style=\"margin:0\"><div><dt class=\"eyebrow\" style=\"display:block\">Процедура<\/dt><dd class=\"mono\" style=\"margin:.4rem 0 0;font-weight:700;color:var(--ink)\">2,5-3 ч<\/dd><\/div><div><dt class=\"eyebrow\" style=\"display:block\">Коррекция<\/dt><dd class=\"mono\" style=\"margin:.4rem 0 0;font-weight:700;color:var(--ink)\">6-8 недель<\/dd><\/div><div><dt class=\"eyebrow\" style=\"display:block\">Держится<\/dt><dd class=\"mono\" style=\"margin:.4rem 0 0;font-weight:700;color:var(--ink)\">1-3 года<\/dd><\/div><div><dt class=\"eyebrow\" style=\"display:block\">От<\/dt><dd class=\"mono\" style=\"margin:.4rem 0 0;font-weight:700;color:var(--ink)\">350 AED<\/dd><\/div><\/dl>\n      <div class=\"btn-row mt-6\">\n        <a class=\"btn btn--gold\" href=\"https://wa.me/971500000000?text=%D0%97%D0%B4%D1%80%D0%B0%D0%B2%D1%81%D1%82%D0%B2%D1%83%D0%B9%D1%82%D0%B5%2C%20%D0%9C%D0%B8%D0%BB%D0%B0%D0%BD%D0%B0%21%20%D0%A5%D0%BE%D1%87%D1%83%20%D0%B7%D0%B0%D0%BF%D0%B8%D1%81%D0%B0%D1%82%D1%8C%D1%81%D1%8F%20%D0%BD%D0%B0%20%D0%BF%D1%80%D0%BE%D1%86%D0%B5%D0%B4%D1%83%D1%80%D1%83.\" target=\"_blank\" rel=\"noopener\">Записаться на губы<\/a>\n        <a class=\"btn btn--ghost\" href=\"#/ru/pricing\">Посмотреть цены<\/a>\n      <\/div>\n    <\/div>\n    <div class=\"media-frame reveal\" data-delay=\"1\">\n      <img src=\"data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAxMjAwIDkwMCIgd2lkdGg9IjEyMDAiIGhlaWdodD0iOTAwIiByb2xlPSJpbWciIGFyaWEtbGFiZWw9IlBsYWNlaG9sZGVyIGZvciBhIGxpcCBibHVzaCBwaG90b2dyYXBoIj4KICA8ZGVmcz4KICAgIDxsaW5lYXJHcmFkaWVudCBpZD0iZyIgeDE9IjAiIHkxPSIwIiB4Mj  <div class=\"wrap split\">\n    <div class=\"reveal\">\n      <p class=\"eyebrow\">Камуфляж<\/p>\n      <h2 class=\"h2-caps\">Камуфляж рубцов и растяжек<\/h2>\n      <p class=\"lead mt-4\">Сделать так, чтобы взгляд перестал цепляться — совпадением по тону, а не перекрытием.<\/p>\n      <p class=\"mt-4\">Камуфляж вводит пигмент телесного тона в зрелый рубец, растяжку или участок с потерей пигмента, чтобы он слился с окружающей кожей. Он не убирает рубец и не меняет его рельеф. Он убирает контраст по цвету — то, из-за чего взгляд туда падает.<\/p><p class=\"mt-4\">Работа идёт за несколько визитов, обычно два-четыре, с интервалом восемь-двенадцать недель. Рубцовая ткань держит пигмент непредсказуемо, поэтому каждый следующий визит планируется по тому, как зажил предыдущий.<\/p><p class=\"mt-4\">Подходит не каждый рубец. Выпуклые, келоидные и ещё красные не берутся в работу, а перед большой зоной всегда делается тест на маленьком участке.<\/p>\n      <h3 class=\"mt-6\" style=\"font-size:1rem;letter-spacing:-.01em\">Кому подходит<\/h3>\n      <ul class=\"mt-4\" style=\"list-style:none;padding:0;display:grid;gap:.6rem\"><li class='tick'>Белые зрелые растяжки на бёдрах, ногах, груди<\/li><li class='tick'>Рубцы после кесарева, абдоминопластики и мастэктомии<\/li><li class='tick'>Витилиго и другие участки с потерей пигмента<\/li><li class='tick'>Пересадки кожи и зажившие ожоги<\/li><li class='tick'>Камуфляж рубцов в зоне роста волос<\/li><li class='tick'>Старые следы после травм и операций<\/li><\/ul>\n      <dl class=\"grid grid--4 mt-6\" style=\"margin:0\"><div><dt class=\"eyebrow\" style=\"display:block\">Визит<\/dt><dd class=\"mono\" style=\"margin:.4rem 0 0;font-weight:700;color:var(--ink)\">1-3 ч<\/dd><\/div><div><dt class=\"eyebrow\" style=\"display:block\">Визитов<\/dt><dd class=\"mono\" style=\"margin:.4rem 0 0;font-weight:700;color:var(--ink)\">2-4<\/dd><\/div><div><dt class=\"eyebrow\" style=\"display:block\">Интервал<\/dt><dd class=\"mono\" style=\"margin:.4rem \"mt-4\" style=\"font-size:.925rem\">Ничего не вводится, пока вы не увидели прорисованную форму в зеркале и не согласились с ней. Если по форме не сходимся — не начинаем, и вы ничего не платите.<\/p><\/div><div class=\"reveal\" data-delay=\"1\"><h3 style=\"letter-spacing:-.01em;font-size:1rem\">Светлее, чем цель<\/h3><p class=\"mt-4\" style=\"font-size:.925rem\">Пигмент темнеет при заживлении, поэтому первый визит строит базу намеренно светлее итога. Цвет задаётся на коррекции. Кто заканчивает за один проход — угадывает.<\/p><\/div><div class=\"reveal\" data-delay=\"2\"><h3 style=\"letter-spacing:-.01em;font-size:1rem\">Честно о том, что возможно<\/h3><p class=\"mt-4\" style=\"font-size:.925rem\">Некоторые рубцы трогать нельзя, а некоторым бровям сначала нужна коррекция старой работы. Этот ответ вы получаете до депозита, а не после.<\/p><\/div><\/div>\n  <\/div>\n<\/section>\n<section class=\"section\">\n  <div class=\"wrap split\">\n    <div class=\"reveal\">\n      <p class=\"eyebrow\">Безопасность<\/p>\n      <h2 class=\"h2-caps\">Стерильно, одноразово, вскрывается при вас<\/h2>\n      <p class=\"lead mt-4\">Выезд на дом не означает мягких стандартов. Раскладка, которая приезжает к вам, — та же, что вы бы увидели в кабинете.<\/p>\n      <ul class=\"mt-6\" style=\"list-style:none;padding:0;display:grid;gap:.7rem\"><li class='tick'>Иглы и картриджи одноразовые и вскрываются при вас<\/li><li class='tick'>Ёмкости для пигмента, перчатки, станки и плёнка — одноразовые<\/li><li class='tick'>Барьерная плёнка на всех поверхностях и на машинке<\/li><li class='tick'>Анамнез и противопоказания проверяются до подтверждения даты<\/li><li class='tick'>Тестовый участок перед началом любой зоны камуфляжа<\/li><li class='tick'>Письменные рекомендации и связь в неделю заживления<\/li><\/ul>\n    <\/div>\n    <div class=\"media-frame reveal\" data-delay=\"1\">\n      <img src=\"data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAxMjAwIDkw >Записаться<\/a>\n    <\/nav>\n    <button class=\"burger\" type=\"button\" aria-expanded=\"false\" aria-label=\"Меню\"><span><\/span><\/button>\n  <\/div>\n  <div class=\"header__rule\"><span><\/span><\/div>\n<\/header>\n<main id=\"main\" class=\"page\">\n<section class=\"section section--tight\">\n  <div class=\"wrap\">\n    <div class=\"head\">\n      <p class=\"eyebrow\">Вопросы<\/p>\n      <h1 class=\"display\" style=\"font-size:var(--fs-h1)\">Вопросы перед записью<\/h1>\n      <p class=\"lead\">Те, что приходят в директ каждую неделю. Если вашего здесь нет — напишите, честный ответ ничего не стоит.<\/p>\n    <\/div>\n  <\/div>\n<\/section>\n<div class=\"pigment-strip\" aria-hidden=\"true\"><div><\/div><div><\/div><div><\/div><div><\/div><div><\/div><div><\/div><div><\/div><div><\/div><\/div>\n<section class=\"section section--white\">\n  <div class=\"wrap wrap--narrow\"><section class=\"mt-6 reveal\"><h2 class=\"h2-caps\" style=\"font-size:var(--fs-h3)\">До процедуры<\/h2><div class=\"faq\"><details><summary>Это больно?<\/summary><div><p>Анестезия наносится до и во время процедуры. Брови большинство описывает как царапание, губы — как тёплое жужжание. Камуфляж на теле обычно переносится легче всего.<\/p><p>За неделю до менструации кожа чувствительнее — это стоит учесть при записи.<\/p><\/div><\/details><details><summary>Кому перманент не подходит?<\/summary><div><p>Процедура не делается при беременности и грудном вскармливании, при активном воспалении или инфекции в зоне, а также при склонности к келоидам. При диабете, аутоиммунных заболеваниях, приёме антикоагулянтов и после изотретиноина (роаккутана) в последние шесть-двенадцать месяцев нужно сначала спросить врача.<\/p><p>Расскажите об этом на консультации. Часть пунктов означает подождать, а не «никогда».<\/p><\/div><\/details><details><summary>Что нужно подготовить дома?<\/summary><div><p>Стол или кровать, где можно лечь, розетку рядом и по возможности комнату с дневным светом. Заложите около трёх часов без прерываний.<\/p><p>В день процедуры без кофе и алкоголя, а за неделю уберите с зоны кислоты и ретинол.<\/p><\/div><\/details><details><summary>Можно ли исправить чужую работу?<\/summary><div><p>Иногда да. Пришлите фото при дневном свете в текущем состоянии — скажу, можно ли перекрывать, нужно ли сначала осветление, или лучше дать выцвести.<\/p><\/div><\/details><\/div><\/section><section class=\"mt-6 reveal\"><h2 class=\"h2-caps\" style=\"font-size:var(--fs-h3)\">Во время процедуры<\/h2><div class=\"faq\"><details><summary>Сколько это длится?<\/summary><div><p>Два с половиной — три часа на брови или губы, включая консультацию и построение формы. Один-три часа на зону камуфляжа.<\/p><\/div><\/details><details><summary>Цвет выбираю я?<\/summary><div><p>Вы выбираете направление: теплее, холоднее, мягче, ярче. Я смешиваю в пределах того, что реально удержит ваш подтон, и прямо скажу, если запрос заживёт плохо.<\/p><\/div><\/details><details><summary>Это будет выглядеть как макияж?<\/summary><div><p>В первый день ярче итога. После заживления пудровые брови читаются как лёгкая пудра, а губы — как ваши губы с большим количеством цвета, а не как помада.<\/p><\/div><\/details><\/div><\/section><section class=\"mt-6 reveal\"><h2 class=\"h2-caps\" style=\"font-size:var(--fs-h3)\">Заживление и уход<\/h2><div class=\"faq\"><details><summary>Как проходит первый месяц?<\/summary><div><p>Темнее всего на второй-третий день, шелушение с четвёртого по седьмой, пятнистая серая фаза на второй неделе и настоящий цвет примерно на 28-й день. Полная схема — на главной странице.<\/p><\/div><\/details><details><summary>Можно ли плавать, тренироваться и загорать?<\/summary><div><p>Две недели без бассейна, моря и сауны, первую неделю без активного потоотделения, и никакого прямого солнца на зону до полного заживления. Дальше цвет держит SPF.<\/p><\/div><\/details><details><summary>Коррекция обязательна?<\/summary><div><p>Да, если нужен результат как на фотографиях. Первый визит строит базу, второй задаёт цвет и правит неровности. Через четыре-восемь недель после первого.<\/p><\/div><\/details><\/div><\/section><section class=\"mt-6 reveal\"><h2 class=\"h2-caps\" style=\"font-size:var(--fs-h3)\">Камуфляж<\/h2><div class=\"faq\"><details><summary>Через сколько после операции можно?<\/summary><div><p>Обычно не раньше двенадцати месяцев и только после подтверждения хирурга или врача, что рубец созрел, закрыт и больше не меняется. Работа раньше срока может повлиять на то, как он сядет.<\/p><\/div><\/details><details><summary>Какие рубцы не подходят?<\/summary><div><p>Выпуклые, келоидные и гипертрофические, всё ещё красное или фиолетовое, и рубцы, которые продолжают меняться. Сильно загорающая кожа тоже сложнее: она меняет тон с солнцем, а пигмент — нет.<\/p><\/div><\/details><details><summary>Работает ли это на растяжках?<\/summary><div><p>На белых зрелых растяжках, потерявших пигмент, — да. На красных и фиолетовых — нет: они ещё меняются, и их цвет тоже.<\/p><\/div><\/details><details><summary>Сколько визитов нужно на зону?<\/summary><div><p>Обычно два-четыре, с интервалом восемь-двенадцать недель. Пауза не для растягивания: рубцовая ткань держит пигмент непредсказуемо, и каждый визит планируется по тому, как зажил предыдущий.<\/p><\/div><\/details><details><summary>Рубец исчезнет полностью?<\/summary><div><p>Нет — и тот, кто это обещает, вам что-то продаёт. Камуфляж убирает контраст по цвету, а не рельеф. При дневном свете, с расстояния разговора, хорошо подобранная зона перестаёт притягивать взгляд. Это честная цель.<\/p><\/div><\/details><\/div><\/section>\n    <p class=\"price-note mt-6\">Эта страница — общая информация о процедурах, а не медицинская консультация. При хронических заболеваниях, постоянном приёме препаратов или сомнениях по поводу рубца сначала спросите врача.<\/p>\n  <\/div>\n<\/section>\n<section class=\"section section--dark\">\n  <div class=\"wrap\">\n    <div class=\"head head--center\">\n      <p class=\"eyebrow eyebrow--center\">Остались сомнения<\/p>\n      <h2 class=\"h2-caps\">Спросите напрямую<\/h2>\n      <p class=\"lead\">Если вашей ситуации здесь нет — напишите. Я скорее отговорю от процедуры, чем сделаю ту, что не сработает.<\/p>\n      <div class=\"btn-row mt-5\" style=\"justify-content:center\">\n        <a class=\"btn btn--gold btn--lg\" href=\"https://wa.me/971500000000?text=%D0%97%D0%B4%D1%80%D0%B0%D0%B2%D1%81%D1%82%D0%B2%D1%83%D0%B9%D1%82%D0%B5%2C%20%D0%9C%D0%B8%D0%BB%D0%B0%D0%BD%D0%B0%21%20%D0%A5%D0%BE%D1%87%D1%83%20%D0%B7%D0%B0%D0%BF%D0%B8%D1%81%D0%B0%D1%82%D1%8C%D1%81%D1%8F%20%D0%BD%D0%B0%20%D0%BF%D1%80%D0%BE%D1%86%D0%B5%D0%B4%D1%83%D1%80%D1%83.\" target=\"_blank\" rel=\"noopener\">Написать в WhatsApp<\/a>\n        <a class=\"btn btn--ghost btn--lg\" href=\"#/ru/contact\">Контакты<\/a>\n      <\/div>\n    <\/div>\n  <\/div>\n<\/section>\n<\/main>\n<div class=\"dock\">\n  <a href=\"https://wa.me/971500000000?text=%D0%97%D0%B4%D1%80%D0%B0%D0%B2%D1%81%D1%82%D0%B2%D1%83%D0%B9%D1%82%D0%B5%2C%20%D0%9C%D0%B8%D0%BB%D0%B0%D0%BD%D0%B0%21%20%D0%A5%D0%BE%D1%87%D1%83%20%D0%B7%D0%B0%D0%BF%D0%B8%D1%81%D0%B0%D1%82%D1%8C%D1%81%D1%8F%20%D0%BD%D0%B0%20%D0%BF%D1%80%D0%BE%D1%86%D0%B5%D0%B4%D1%83%D1%80%D1%83.\" target=\"_blank\" rel=\"noopener\" aria-label=\"Написать Милане в WhatsApp\"><svg viewBox=\"0 0 32 32\" fill=\"currentColor\" aria-hidden=\"true\"><path d=\"M16.02 3.2c-7.06 0-12.8 5.74-12.8 12.8 0 2.26.6 4.47 1.73 6.42L3.2 28.8l6.55-1.71a12.75 12.75 0 0 0 6.27 1.6h.01c7.06 0 12.8-5.74 12.8-12.8s-5.75-12.69-12.81-12.69zm0 23.04h-.01a10.6 10.6 0 0 1-5.4-1.48l-.39-.23-4.02 1.05 1.07-3.92-.25-.4a10.57 10.57 0 0 1-1.62-5.65c0-5.86 4.77-10.63 10.63-10.63 2.84 0 5.5 1.11 7.51 3.12a10.56 10.56 0 0 1 3.11 7.52c0 5.86-4.77 10.62-10.63 10.62z\"/><path d=\"M21.86 18.7c-.32-.16-1.89-.93-2.18-1.04-.29-.11-.5-.16-.71.16s-.82 1.03-1 1.25c-.19.21-.37.24-.68.08-.32-.16-1.34-.49-2.55-1.57-.94-.84-1.58-1.87-1.77-2.19-.18-.32-.02-.49.14-.65.15-.14.32-.37.48-.56.16-.19.21-.32.32-.53.11-.21.05-.4-.03-.56-.08-.1
